<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mercadito Go - Tu mercado favorito">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mercadito Go">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mercadito Go</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      inset: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      background-color: #142952;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      text-align: center;
    }
  </style>

  <!-- Google Maps JavaScript API (requerido para google_maps_flutter en web).
       El placeholder lo sustituye el workflow deploy-web con un secret; la key
       debe estar restringida por HTTP referrer en Google Cloud. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCR3LFZg0tyotfxK89phZs9A_xBjLzDTgo"></script>

  <!-- Cargar Stripe de forma asíncrona sin bloquear -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var script = document.createElement('script');
      script.src = 'https://js.stripe.com/v3/';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    });
  </script>
  <script>
    // Aviso de pedido nuevo del panel de admin (lib/utils/new_order_alert).
    // Tres tonos con WebAudio, título parpadeante mientras la pestaña está en
    // segundo plano y notificación del navegador si se dio permiso.
    (function () {
      var ctx = null, blink = null, baseTitle = document.title;
      function unlock() {
        try {
          ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
        } catch (e) {}
      }
      // Los navegadores solo permiten sonido tras un clic/tecla del usuario.
      ['pointerdown', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, unlock, { once: false, passive: true });
      });
      function beep(at, freq) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.4, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(at); o.stop(at + 0.4);
      }
      window.m2gRequestOrderAlerts = function () {
        unlock();
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      };
      window.m2gNewOrderAlert = function (message) {
        try {
          unlock();
          var t = ctx.currentTime;
          [0, 0.45, 0.9].forEach(function (d, i) { beep(t + d, i === 2 ? 1175 : 880); });
        } catch (e) {}
        if (document.hidden) {
          if (blink) clearInterval(blink);
          var on = false;
          blink = setInterval(function () {
            document.title = (on = !on) ? '🛒 Pedido nuevo' : baseTitle;
          }, 1000);
          document.addEventListener('visibilitychange', function stop() {
            if (!document.hidden) {
              clearInterval(blink); blink = null; document.title = baseTitle;
              document.removeEventListener('visibilitychange', stop);
            }
          });
          try {
            if ('Notification' in window && Notification.permission === 'granted') {
              var n = new Notification('Mercadito Go', { body: message, icon: 'icons/Icon-192.png', requireInteraction: true });
              n.onclick = function () { window.focus(); n.close(); };
            }
          } catch (e) {}
        }
      };
    })();
  </script>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Cargando Mercadito Go</div>
  </div>

  <script>
    // Función para ocultar la pantalla de carga
    function hideLoading() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          loading.style.display = 'none';
        }, 400);
      }
    }
    
    // Timeout de seguridad para ocultar la pantalla de carga
    setTimeout(hideLoading, 10000);
    
    // Modern Flutter web initialization
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "2350602508",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            
            // Hide loading screen when Flutter first frame is rendered
            window.addEventListener('flutter-first-frame', function() {
              setTimeout(hideLoading, 800);
            });
          });
        }
      });
    });
  </script>

  <script>
    // Chrome en Android: mientras un campo de texto está activo, Flutter web no
    // actualiza el alto de la app, solo el inset del teclado. Si el teclado se
    // cierra en ese momento (p. ej. al iniciar sesión y cambiar de pantalla), la
    // app se queda con el alto que tenía con el teclado abierto y el resto de la
    // pantalla muestra el fondo de la página (la barra inferior se ve enorme).
    // Volver a medir un poco después de que termina la edición lo corrige.
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var timers = [];
      function remeasure() {
        timers.forEach(clearTimeout);
        timers = [300, 1000].map(function (ms) {
          return setTimeout(function () { vv.dispatchEvent(new Event('resize')); }, ms);
        });
      }
      // Si el teclado se cierra con el campo aún activo, la app quita el foco
      // (StaleKeyboardFix en lib/core/web) y este focusout dispara la medición.
      document.addEventListener('focusout', remeasure, true);
      vv.addEventListener('resize', function (e) { if (e.isTrusted) remeasure(); });
      window.addEventListener('pageshow', remeasure);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) remeasure(); });
    })();
  </script>

  <script>
    // Aviso de versión nueva. La app se guarda en el teléfono (service
    // worker) y la versión publicada solo se veía en la segunda apertura; en
    // iPhone, además, había que cerrarla por completo. Cada pocos minutos y
    // al volver a la app se compara la versión de esta página con la
    // publicada; si cambió, se ofrece actualizar con un toque.
    (function () {
      var current = "2350602508";
      if (!current || !('fetch' in window)) return;
      var shown = false;

      function check() {
        if (shown || document.hidden || navigator.onLine === false) return;
        fetch('index.html?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (html) {
            var m = /serviceWorkerVersion:\s*"?(\d+)"?/.exec(html);
            if (m && m[1] !== String(current)) showBanner();
          })
          .catch(function () {});
      }

      function update() {
        var btn = document.getElementById('mg-update-btn');
        if (btn) { btn.disabled = true; btn.textContent = 'Actualizando…'; }
        // Borrar la copia guardada para que la recarga baje todo nuevo.
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        if ('caches' in window) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }

      function showBanner() {
        shown = true;
        var bar = document.createElement('div');
        bar.setAttribute('role', 'status');
        bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
          'top:calc(env(safe-area-inset-top, 0px) + 12px);z-index:100000;' +
          'width:calc(100% - 24px);max-width:480px;box-sizing:border-box;' +
          'display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;' +
          'background:#142952;color:#fff;border-radius:14px;' +
          'box-shadow:0 6px 24px rgba(0,0,0,.25);font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;';
        bar.innerHTML =
          '<span style="flex:1">Hay una versión nueva de Mercadito Go</span>' +
          '<button id="mg-update-btn" style="flex:none;border:0;border-radius:999px;padding:9px 16px;' +
          'background:#fff;color:#142952;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer">Actualizar</button>' +
          '<button aria-label="Cerrar" id="mg-update-close" style="flex:none;border:0;background:transparent;' +
          'color:#fff;font-size:20px;line-height:1;padding:4px 6px;cursor:pointer">×</button>';
        document.body.appendChild(bar);
        document.getElementById('mg-update-btn').addEventListener('click', update);
        document.getElementById('mg-update-close').addEventListener('click', function () {
          bar.remove();
          // Se vuelve a ofrecer más tarde.
          setTimeout(function () { shown = false; }, 30 * 60 * 1000);
        });
      }

      setTimeout(check, 20000);
      setInterval(check, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    })();
  </script>

  <!-- Load Flutter.js for modern initialization -->
  <script src="flutter.js" defer></script>
</body>
</html>
