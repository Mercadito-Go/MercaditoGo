<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mercadito Go - Tu mercado favorito">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mercadito Go">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mercadito Go</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      inset: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      background-color: #142952;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      text-align: center;
    }
  </style>

  <!-- Google Maps JavaScript API (requerido para google_maps_flutter en web).
       El placeholder lo sustituye el workflow deploy-web con un secret; la key
       debe estar restringida por HTTP referrer en Google Cloud. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCR3LFZg0tyotfxK89phZs9A_xBjLzDTgo"></script>

  <!-- Cargar Stripe de forma asíncrona sin bloquear -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var script = document.createElement('script');
      script.src = 'https://js.stripe.com/v3/';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    });
  </script>
  <script>
    // Aviso de pedido nuevo del panel de admin (lib/utils/new_order_alert).
    // Tres tonos con WebAudio, título parpadeante mientras la pestaña está en
    // segundo plano y notificación del navegador si se dio permiso.
    (function () {
      var ctx = null, blink = null, baseTitle = document.title;
      function unlock() {
        try {
          ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
        } catch (e) {}
      }
      // Los navegadores solo permiten sonido tras un clic/tecla del usuario.
      ['pointerdown', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, unlock, { once: false, passive: true });
      });
      function beep(at, freq) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.4, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(at); o.stop(at + 0.4);
      }
      window.m2gRequestOrderAlerts = function () {
        unlock();
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      };
      window.m2gNewOrderAlert = function (message) {
        try {
          unlock();
          var t = ctx.currentTime;
          [0, 0.45, 0.9].forEach(function (d, i) { beep(t + d, i === 2 ? 1175 : 880); });
        } catch (e) {}
        if (document.hidden) {
          if (blink) clearInterval(blink);
          var on = false;
          blink = setInterval(function () {
            document.title = (on = !on) ? '🛒 Pedido nuevo' : baseTitle;
          }, 1000);
          document.addEventListener('visibilitychange', function stop() {
            if (!document.hidden) {
              clearInterval(blink); blink = null; document.title = baseTitle;
              document.removeEventListener('visibilitychange', stop);
            }
          });
          try {
            if ('Notification' in window && Notification.permission === 'granted') {
              var n = new Notification('Mercadito Go', { body: message, icon: 'icons/Icon-192.png', requireInteraction: true });
              n.onclick = function () { window.focus(); n.close(); };
            }
          } catch (e) {}
        }
      };
    })();
  </script>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Cargando Mercadito Go</div>
  </div>

  <script>
    // Función para ocultar la pantalla de carga
    function hideLoading() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          loading.style.display = 'none';
        }, 400);
      }
    }
    
    // Timeout de seguridad para ocultar la pantalla de carga
    setTimeout(hideLoading, 10000);
    
    // Modern Flutter web initialization
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "1866011997",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            
            // Hide loading screen when Flutter first frame is rendered
            window.addEventListener('flutter-first-frame', function() {
              setTimeout(hideLoading, 800);
            });
          });
        }
      });
    });
  </script>

  <script>
    // Chrome en Android: mientras un campo de texto está activo, Flutter web no
    // actualiza el alto de la app, solo el inset del teclado. Si el teclado se
    // cierra en ese momento (p. ej. al iniciar sesión y cambiar de pantalla), la
    // app se queda con el alto que tenía con el teclado abierto y el resto de la
    // pantalla muestra el fondo de la página (la barra inferior se ve enorme).
    // Volver a medir un poco después de que termina la edición lo corrige.
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var timers = [];
      function remeasure() {
        timers.forEach(clearTimeout);
        timers = [300, 1000].map(function (ms) {
          return setTimeout(function () { vv.dispatchEvent(new Event('resize')); }, ms);
        });
      }
      // Si el teclado se cierra con el campo aún activo, la app quita el foco
      // (StaleKeyboardFix en lib/core/web) y este focusout dispara la medición.
      document.addEventListener('focusout', remeasure, true);
      vv.addEventListener('resize', function (e) { if (e.isTrusted) remeasure(); });
      window.addEventListener('pageshow', remeasure);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) remeasure(); });
    })();
  </script>

  <script>
    // Aviso de versión nueva. La app se guarda en el teléfono (service
    // worker) y la versión publicada solo se veía en la segunda apertura; en
    // iPhone, además, había que cerrarla por completo. Cada pocos minutos y
    // al volver a la app se compara la versión de esta página con la
    // publicada; si cambió, se ofrece actualizar con un toque.
    (function () {
      var current = "1866011997";
      if (!current || !('fetch' in window)) return;
      var shown = false;

      function check(auto) {
        if (shown || document.hidden || navigator.onLine === false) return;
        fetch('index.html?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (html) {
            var m = /serviceWorkerVersion:\s*"?(\d+)"?/.exec(html);
            if (m && m[1] !== String(current)) {
              // Tras mucho tiempo sin abrir la app no hay nada en curso que
              // perder: se actualiza sola en vez de pedir un toque.
              if (auto === true) { shown = true; update(); } else showBanner();
            }
          })
          .catch(function () {});
      }

      function withTimeout(p, ms) {
        return Promise.race([p, new Promise(function (resolve) { setTimeout(resolve, ms); })]);
      }

      var updating = false;
      function update() {
        if (updating) return;
        updating = true;
        var btn = document.getElementById('mg-update-btn');
        if (btn) { btn.disabled = true; btn.textContent = 'Actualizando…'; }
        // Pase lo que pase se recarga a los 20 s: antes, si el navegador no
        // respondía al borrar la copia guardada, el botón se quedaba sin hacer nada.
        setTimeout(function () { location.reload(); }, 20000);
        var jobs = [];
        // Borrar la copia guardada (service worker y caché) para bajar todo nuevo.
        if ('serviceWorker' in navigator) {
          jobs.push(withTimeout(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }), 4000));
        }
        if ('caches' in window) {
          jobs.push(withTimeout(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }), 4000));
        }
        // GitHub Pages deja los archivos 10 min en la caché del navegador, y una
        // recarga normal podía volver a abrir la versión vieja. Se piden de nuevo
        // saltando esa caché para que la recarga ya encuentre la versión nueva.
        ['index.html', 'flutter_bootstrap.js', 'flutter.js', 'main.dart.js', 'manifest.json'].forEach(function (f) {
          jobs.push(withTimeout(fetch(f, { cache: 'reload' }).catch(function () {}), 15000));
        });
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }

      function showBanner() {
        shown = true;
        var bar = document.createElement('div');
        bar.setAttribute('role', 'status');
        bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
          'top:calc(env(safe-area-inset-top, 0px) + 12px);z-index:100000;' +
          'width:calc(100% - 24px);max-width:480px;box-sizing:border-box;' +
          'display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;' +
          'background:#142952;color:#fff;border-radius:14px;' +
          'box-shadow:0 6px 24px rgba(0,0,0,.25);font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;';
        bar.innerHTML =
          '<span style="flex:1">Hay una versión nueva de Mercadito Go</span>' +
          '<button id="mg-update-btn" style="flex:none;border:0;border-radius:999px;padding:9px 16px;' +
          'background:#fff;color:#142952;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer">Actualizar</button>' +
          '<button aria-label="Cerrar" id="mg-update-close" style="flex:none;border:0;background:transparent;' +
          'color:#fff;font-size:20px;line-height:1;padding:4px 6px;cursor:pointer">×</button>';
        document.body.appendChild(bar);
        var ub = document.getElementById('mg-update-btn');
        ub.addEventListener('click', update);
        ub.addEventListener('touchend', function (e) { e.preventDefault(); update(); }, { passive: false });
        document.getElementById('mg-update-close').addEventListener('click', function () {
          bar.remove();
          // Se vuelve a ofrecer más tarde.
          setTimeout(function () { shown = false; }, 30 * 60 * 1000);
        });
      }

      var hiddenAt = 0;
      var LONG_IDLE = 2 * 60 * 60 * 1000;
      setTimeout(check, 20000);
      setInterval(check, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { hiddenAt = Date.now(); return; }
        var idle = hiddenAt ? Date.now() - hiddenAt : 0;
        hiddenAt = 0;
        check(idle > LONG_IDLE);
      });
    })();
  </script>

  <script>
    // Invitación a instalar la app en la pantalla de inicio (solo en el celular
    // y solo si todavía no está instalada). Android/Chrome ofrece el botón
    // "Instalar"; iPhone/Safari no tiene botón, así que se explican los pasos.
    // "Ahora no" la oculta 14 días.
    (function () {
      var KEY = 'mg_install_dismissed_at';
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (!isIOS && !isAndroid) return;

      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
      if (standalone) return;

      try {
        var d = parseInt(localStorage.getItem(KEY) || '0', 10);
        if (d && Date.now() - d < 14 * 24 * 3600 * 1000) return;
      } catch (e) {}

      var deferred = null;
      var shown = false;

      function dismiss(bar) {
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        if (bar) bar.remove();
      }

      function show(html, onInstall) {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.setAttribute('role', 'dialog');
        bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
          'bottom:calc(env(safe-area-inset-bottom, 0px) + 92px);z-index:99999;' +
          'width:calc(100% - 24px);max-width:480px;box-sizing:border-box;' +
          'padding:14px 14px 12px 16px;background:#fff;color:#1d2433;border-radius:16px;' +
          'box-shadow:0 8px 28px rgba(20,41,82,.30);border:1px solid #e3e6ec;' +
          'font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;';
        bar.innerHTML =
          '<div style="display:flex;gap:12px;align-items:center">' +
          '<img src="icons/Icon-192.png" alt="" width="44" height="44" style="border-radius:10px;flex:none">' +
          '<div style="flex:1"><b style="color:#142952;font-size:15px">Instala Mercadito Go</b><br>' + html + '</div></div>' +
          '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">' +
          '<button id="mg-inst-no" style="border:0;background:transparent;color:#5b6475;font:600 14px system-ui,sans-serif;padding:8px 10px;cursor:pointer">Ahora no</button>' +
          (onInstall ? '<button id="mg-inst-yes" style="border:0;border-radius:999px;background:#142952;color:#fff;font:600 14px system-ui,sans-serif;padding:9px 18px;cursor:pointer">Instalar</button>' : '') +
          '</div>';
        document.body.appendChild(bar);
        document.getElementById('mg-inst-no').addEventListener('click', function () { dismiss(bar); });
        if (onInstall) {
          document.getElementById('mg-inst-yes').addEventListener('click', function () { onInstall(bar); });
        }
      }

      if (isAndroid) {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferred = e;
          // Un poco después de abrir, para no tapar la pantalla de carga.
          setTimeout(function () {
            show('Ábrela directo desde tu pantalla de inicio, más rápida y a pantalla completa.', function (bar) {
              if (!deferred) return;
              deferred.prompt();
              deferred.userChoice.then(function () { deferred = null; bar.remove(); });
            });
          }, 6000);
        });
        window.addEventListener('appinstalled', function () {
          var b = document.querySelector('[role=dialog]'); if (b) b.remove();
        });
      } else if (isIOS) {
        // Solo Safari puede añadir a la pantalla de inicio (no Chrome ni Firefox en iPhone).
        var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
        setTimeout(function () {
          if (isSafari) {
            show('Toca <b>Compartir</b> <span aria-hidden="true">⬆️</span> y luego <b>«Añadir a pantalla de inicio»</b>.', null);
          } else {
            show('Ábrela en <b>Safari</b> para instalarla: toca <b>Compartir</b> y luego <b>«Añadir a pantalla de inicio»</b>.', null);
          }
        }, 6000);
      }
    })();
  </script>

  <!-- Load Flutter.js for modern initialization -->
  <script src="flutter.js" defer></script>
</body>
</html>
