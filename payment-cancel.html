<!DOCTYPE html>
<!--
  Página a la que Stripe regresa si el cliente cancela el pago
  (https://app.mercadito-go.com/payment-cancel.html). No se hizo ningún cargo.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142952">
  <meta name="robots" content="noindex">
  <title>Pago cancelado · Mercadito Go</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { --navy: #142952; --ink: #1d2433; --muted: #5b6475; --bg: #f6f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 6px 24px rgba(20,41,82,.12);
            max-width: 420px; width: 100%; padding: 32px 24px; text-align: center; }
    .logo { width: 72px; height: 72px; border-radius: 16px; }
    .icon { width: 64px; height: 64px; margin: 16px auto 8px; border-radius: 50%; background: #fdf0e3;
            color: #C4924B; font-size: 34px; line-height: 64px; font-weight: 700; }
    h1 { margin: 8px 0 8px; font-size: 24px; color: var(--navy); }
    p { margin: 8px 0; color: var(--muted); }
    .btn { display: block; margin-top: 18px; padding: 14px 20px; border-radius: 12px; font-weight: 700;
           text-decoration: none; font-size: 16px; background: var(--navy); color: #fff; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="icons/Icon-192.png" alt="Mercadito Go">
    <div class="icon" aria-hidden="true">!</div>
    <h1>Pago cancelado</h1>
    <p>No se hizo ningún cargo a tu tarjeta.</p>
    <p>Regresa a <b>Mercadito Go</b> para intentarlo de nuevo o elegir otro método de pago.</p>
    <a class="btn" href="https://app.mercadito-go.com/">Abrir Mercadito Go</a>
  </main>
</body>
</html>
